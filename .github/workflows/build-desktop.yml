name: Build desktop app

# Builds the Electron wrapper for macOS, Windows, and Linux and attaches the
# installers to a GitHub Release. Triggered by pushing a tag like "v1.0.0"
# (can be done entirely from github.com — see SETUP_NOTES.md), or manually
# from the Actions tab ("Run workflow").
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Don't let one platform's failure cancel the other two mid-build —
      # without this, a Linux-only problem (see below) took macOS/Windows
      # down with it even though they were building fine.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # GitHub's ubuntu-latest runner moved to Ubuntu 24.04, which dropped
      # libfuse2 from the base image. electron-builder's AppImage step needs
      # it to run appimagetool — without this, only the Linux build fails.
      - name: Install libfuse2 (needed for AppImage on Ubuntu 24.04 runners)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Install dependencies
        working-directory: electron
        run: npm install

      # --publish=never: this workflow's own "release" job below handles
      # uploading assets, so electron-builder shouldn't also try to publish
      # on its own (it can auto-detect a GitHub remote and attempt to).
      - name: Build installer
        working-directory: electron
        run: npm run dist -- --publish=never

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            electron/dist/*.dmg
            electron/dist/*.exe
            electron/dist/*.AppImage
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
